---
- name: Renew Let's Encrypt certificates on multiple hosts
  hosts: all
  become: true
  ignore_unreachable: true

  vars_files:
    - ../../shared/vars/connection-defaults.yml
  vars:
    ansible_ssh_args: >-
      -o ControlMaster=auto
      -o ControlPersist=10m
      -o ConnectTimeout=30
      -o ServerAliveInterval=30
      -o ServerAliveCountMax=3
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o ConnectTimeout=30"
    ansible_timeout: 300

    discord_webhook_url: "{{ lookup('env', 'ADW_CERTBOT') }}"
    certbot_log_file: "/var/log/letsencrypt/letsencrypt.log"
    certbot_temp_log: "/tmp/certbot.log"
    certbot_renewed_domains_file: "/tmp/certbot-renewed-domains.txt"
    certbot_deploy_hook: "/tmp/certbot-record-renewed-domains.sh"

  tasks:
    - name: Ensure letsencrypt log directory exists
      file:
        path: /var/log/letsencrypt
        state: directory
        mode: "0755"

    - name: Clear existing Certbot log file
      file:
        path: "{{ certbot_log_file }}"
        state: absent

    - name: Initialize exact renewed domains report
      shell: ": > {{ certbot_renewed_domains_file | quote }}"
      changed_when: false

    - name: Create Certbot deploy hook for exact domain reporting
      copy:
        dest: "{{ certbot_deploy_hook }}"
        mode: "0700"
        content: |
          #!/bin/sh
          certificate_name="$(basename "$RENEWED_LINEAGE")"
          openssl x509 -in "$RENEWED_LINEAGE/cert.pem" -noout -ext subjectAltName 2>/dev/null \
            | sed -n '/^[[:space:]]*DNS:/ { s/^[[:space:]]*DNS://; s/, DNS:/\n/g; p; }' \
            | while IFS= read -r domain; do
                [ -n "$domain" ] && printf '%s|%s\n' "$certificate_name" "$domain" >> "{{ certbot_renewed_domains_file }}"
              done
          exit 0

    - name: Renew Let's Encrypt certificates
      shell: |
        set -o pipefail
        for i in {1..3}; do
          if certbot renew --dns-cloudflare --non-interactive -v --deploy-hook "{{ certbot_deploy_hook }}" 2>&1 | tee "{{ certbot_temp_log }}"; then
            exit 0
          fi
          echo "Renewal attempt $i failed. Retrying in 60 seconds..." >&2
          if [ "$i" -lt 3 ]; then
            sleep 60
          fi
        done
        exit 1
      args:
        executable: /bin/bash
      register: certbot_result
      changed_when: >
        'Congratulations' in certbot_result.stdout or
        'successfully renewed' in certbot_result.stdout

    - name: Print certbot log to Semaphore UI
      debug:
        var: certbot_result.stdout_lines

    - name: Reload nginx if certificates were renewed
      shell: |
        nginx -t && nginx -s reload
      when: >
        'Congratulations' in certbot_result.stdout or
        'successfully renewed' in certbot_result.stdout

    - name: Extract renewed domains from certbot output
      set_fact:
        renewed_domains: >-
          {{
            certbot_result.stdout_lines
            | select('search', '^Renewing an existing certificate for')
            | map('regex_replace', '^Renewing an existing certificate for ', '')
            | map('regex_replace', ' more$', ' more domains')
            | list
          }}

    - name: Read exact renewed domains from Certbot deploy hook
      slurp:
        src: "{{ certbot_renewed_domains_file }}"
      register: renewed_domains_report
      changed_when: false
      failed_when: false

    - name: Initialize exact renewed domain records
      set_fact:
        renewed_domain_records: []

    - name: Record exact domains for renewed certificates
      set_fact:
        renewed_domain_records: >-
          {{ renewed_domain_records + [{
            'certificate': item.split('|', 1)[0],
            'domain': item.split('|', 1)[1]
          }] }}
      loop: "{{ (renewed_domains_report.content | default('') | b64decode).splitlines() }}"
      when: item is match('^[^|]+\\|.+$')

    - name: Prepare Discord renewal details
      set_fact:
        renewed_domains_text: |
          {% if renewed_domain_records | length > 0 %}
          {% for certificate_name in renewed_domain_records | map(attribute='certificate') | unique | list %}
          **{{ certificate_name }}**
          {% for domain in renewed_domain_records | selectattr('certificate', 'equalto', certificate_name) | map(attribute='domain') %}
          • `{{ domain }}`
          {% endfor %}
          {% endfor %}
          {% else %}
          {{ renewed_domains | join('\n') }}
          {% endif %}
      when: renewed_domains | length > 0

    - name: Send Discord webhook notification for successful renewal
      uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          embeds:
            - title: "🔐 Let's Encrypt Certificate Renewed"
              description: "Certificate renewal completed and Nginx was reloaded successfully."
              color: 3066993
              fields:
                - name: "🖥️ Host"
                  value: "`{{ inventory_hostname }}`"
                  inline: true
                - name: "Renewed Certificates & Domains"
                  value: "{{ renewed_domains_text }}"
                - name: "✅ Status"
                  value: "Certbot successful; Nginx configuration validated and reloaded."
              footer:
                text: "Completed {{ lookup('pipe', 'date -u +\"%Y-%m-%dT%H:%M:%SZ\"') }}"
      when: renewed_domains | length > 0

    - name: Remove temporary Certbot files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ certbot_temp_log }}"
        - "{{ certbot_renewed_domains_file }}"
        - "{{ certbot_deploy_hook }}"
