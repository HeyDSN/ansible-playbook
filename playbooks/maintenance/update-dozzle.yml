---
- hosts: all
  gather_facts: false
  become: true
  vars_files:
    - ../../shared/vars/connection-defaults.yml
  vars:
    compose_dirs:
      - /home/ubuntu/dozzle
      - /root/dozzle

  tasks:
    - name: Check for docker-compose.yml in supported locations
      stat:
        path: "{{ item }}/docker-compose.yml"
      loop: "{{ compose_dirs }}"
      register: compose_files

    - name: Select the first available Docker Compose directory
      set_fact:
        compose_dir: >-
          {{ compose_files.results
             | selectattr('stat.exists')
             | map(attribute='item')
             | list
             | first
             | default('') }}

    - name: Skip hosts without Dozzle
      meta: end_host
      when: compose_dir | length == 0

    - name: Pull latest images and check for updates
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        pull: always
        state: present
      register: compose_pull_job
      async: "{{ global_timeout }}"
      poll: 15

    - name: Verify docker compose pull completed
      async_status:
        jid: "{{ compose_pull_job.ansible_job_id }}"
      register: compose_result
      until: compose_result.finished | bool
      retries: 40
      delay: 15
      failed_when: compose_result.failed | bool
      when: compose_pull_job.ansible_job_id is defined

    - name: Check if any containers were updated
      set_fact:
        containers_updated: "{{ compose_pull_job.changed }}"
      when: compose_pull_job is defined

    - name: Prune unused images
      community.docker.docker_prune:
        images: yes
      register: prune_job
      when: containers_updated
      async: "{{ global_timeout }}"
      poll: 15

    - name: Verify docker prune completed
      async_status:
        jid: "{{ prune_job.ansible_job_id }}"
      register: prune_result
      until: prune_result.finished | bool
      retries: 20
      delay: 15
      failed_when: prune_result.failed | bool
      when: containers_updated and prune_job.ansible_job_id is defined

    - name: Prepare Dozzle update notification
      set_fact:
        discord_message:
          embeds:
            - title: "🔄 Dozzle Updated: {{ inventory_hostname }}"
              color: 3066993
              description: "Latest Dozzle image has been pulled and applied."
              footer:
                text: "Updated on {{ lookup('pipe', 'date -u +\"%Y-%m-%dT%H:%M:%SZ\"') }}"
      when: containers_updated | bool

    - name: Send Dozzle update notification
      uri:
        url: "{{ lookup('env', 'ADW_NOTIF') }}"
        method: POST
        body_format: json
        body: "{{ discord_message }}"
        status_code: [200, 204]
        timeout: 30
      delegate_to: localhost
      become: false
      when:
        - containers_updated | bool
        - lookup('env', 'ADW_NOTIF') | length > 0
