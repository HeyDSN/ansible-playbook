---
- hosts: nginx_proxy
  gather_facts: false
  become: true
  ignore_unreachable: true
  vars_files:
    - ../../shared/vars/connection-defaults.yml
  vars:
    cloudflared_deb_url: "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb"
    temp_deb_path: "/tmp/cloudflared.deb"
    playbook_name: "update-cloudflared.yml"

  pre_tasks:
    - name: Check host connectivity
      include_tasks:
        file: ../../shared/tasks/host-connectivity.yml
        apply:
          vars:
            task_name: "Pre-check for Cloudflared Update"
            notification_webhook: "{{ lookup('env', 'ADW_UPDATE') }}"

    - name: Gather facts
      setup:
      when: not host_is_unreachable | default(false)
      async: "{{ global_timeout }}"
      poll: 5

    - name: Include pre-requisite tasks
      include_tasks: ../../shared/tasks/prerequisites.yml

  tasks:
    - name: Check if Cloudflared is installed
      command: cloudflared --version
      register: cloudflared_check
      failed_when: false
      changed_when: false

    - name: Set Cloudflared installation state
      set_fact:
        cloudflared_installed: "{{ cloudflared_check.rc == 0 }}"

    - name: Set installed version fact
      set_fact:
        installed_cloudflared_version: "{{ cloudflared_check.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') | default('unknown', true) }}"
      when: cloudflared_installed | bool

    - name: Set missing Cloudflared version fact
      set_fact:
        installed_cloudflared_version: "not installed"
      when: not cloudflared_installed | bool

    - name: Get latest Cloudflared version
      uri:
        url: "https://api.github.com/repos/cloudflare/cloudflared/releases/latest"
        return_content: yes
      register: latest_release
      failed_when: latest_release.status != 200

    - name: Set latest version fact
      set_fact:
        latest_version: "{{ latest_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Compare versions
      set_fact:
        update_needed: "{{ not (cloudflared_installed | bool) or installed_cloudflared_version == 'unknown' or installed_cloudflared_version != latest_version }}"

    - name: Download latest Cloudflared deb package
      get_url:
        url: "{{ cloudflared_deb_url }}"
        dest: "{{ temp_deb_path }}"
        mode: "0644"
      when: update_needed | bool

    - name: Install Cloudflared deb package
      apt:
        deb: "{{ temp_deb_path }}"
      when: update_needed | bool
      register: install_result

    - name: Restart Cloudflared service
      systemd:
        name: cloudflared.service
        state: restarted
      when: install_result is defined and install_result.changed

    - name: Clean up temporary deb file
      file:
        path: "{{ temp_deb_path }}"
        state: absent
      when: update_needed | bool

    - name: Prepare Discord notification message
      set_fact:
        discord_message:
          embeds:
            - title: "🔄 Cloudflared Update Report for {{ inventory_hostname }}"
              color: 3066993
              fields:
                - name: "🖥️ Host"
                  value: "{{ inventory_hostname }}"
                  inline: true
                - name: "📦 Cloudflared Status"
                  value: "Updated"
                  inline: true
                - name: "🔢 Version"
                  value: "{{ latest_version }}"
                  inline: true
              description: |-
                Cloudflared has been updated to the latest version.
                - Old version: {{ installed_cloudflared_version }}
                - New version: {{ latest_version }}
              footer:
                text: "Report generated on {{ ansible_date_time.iso8601 }}"
      when: install_result is defined and install_result.changed

    - name: Send Discord notification
      uri:
        url: "{{ lookup('env', 'ADW_UPDATE') }}"
        method: POST
        body_format: json
        body: "{{ discord_message }}"
        status_code: [204, 200]  # Accept both 204 and 200 as success
      when:
        - lookup('env', 'ADW_UPDATE') | length > 0
        - install_result is defined and install_result.changed

    - name: Display update report (Debug)
      debug:
        msg: "Cloudflared on {{ inventory_hostname }} has been updated to version {{ latest_version }}"
      when: install_result is defined and install_result.changed
