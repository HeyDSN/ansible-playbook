---
- name: Monitor disk space
  hosts: all
  gather_facts: false
  become: false
  ignore_unreachable: true

  vars_files:
    - ../../shared/vars/connection-defaults.yml
  vars:
    threshold_percent: 80
    playbook_name: "check-disk-space.yml"
    notification_webhook: "{{ lookup('env', 'ADW_NOTIF') }}"

  pre_tasks:
    - name: Check host connectivity
      include_tasks:
        file: ../../shared/tasks/host-connectivity.yml
        apply:
          vars:
            task_name: "Pre-check for Check Disk Space"

  tasks:
    - name: Initialize disk usage results
      set_fact:
        disks_over_threshold: []

    - name: Collect disk usage without writing to the host
      raw: |
        LC_ALL=C df -P -h | awk -v threshold='{{ threshold_percent | int }}' '
          NR > 1 && $1 !~ /^(tmpfs|udev|\/dev\/loop)/ {
            usage = $5
            sub(/%$/, "", usage)
            if (usage + 0 > threshold) {
              mount = $6
              for (i = 7; i <= NF; i++) mount = mount " " $i
              printf "%s\t%s\t%s\n", $1, usage, mount
            }
          }
        '
      register: disk_usage
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Send disk check failure notification
      uri:
        url: "{{ notification_webhook }}"
        method: POST
        body_format: json
        body:
          embeds:
            - title: "⚠️ Disk Space Check Failed: {{ inventory_hostname }}"
              color: 15158332
              description: >-
                Could not collect disk usage. {{ disk_usage.stderr | default('No error output') | truncate(900, true) }}
              footer:
                text: "Report generated on {{ lookup('pipe', 'date -u +\"%Y-%m-%dT%H:%M:%SZ\"') }}"
        status_code: [200, 204]
        timeout: 30
      delegate_to: localhost
      become: false
      when:
        - disk_usage.rc | default(1) != 0
        - notification_webhook | length > 0

    - name: Record disks over threshold
      set_fact:
        disks_over_threshold: >-
          {{ disks_over_threshold + [{
            'device': item.split('\t', 2)[0],
            'usage': item.split('\t', 2)[1] | int,
            'mount': item.split('\t', 2)[2]
          }] }}
      loop: "{{ disk_usage.stdout_lines | default([]) }}"
      when:
        - disk_usage.rc | default(1) == 0
        - item.split('\t', 2) | length == 3

    - name: Prepare disk space notification
      set_fact:
        discord_message:
          embeds:
            - title: "💾 Disk Space Alert for {{ inventory_hostname }}"
              color: 15158332
              fields:
                - name: "Threshold"
                  value: "{{ threshold_percent }}%"
                  inline: true
                - name: "Disks over threshold"
                  value: "{{ disks_over_threshold | length }}"
                  inline: true
              description: |-
                {% for disk in disks_over_threshold %}
                **Device:** `{{ disk.device }}`
                **Usage:** `{{ disk.usage }}%`
                **Mount:** `{{ disk.mount }}`

                {% endfor %}
              footer:
                text: "Report generated on {{ lookup('pipe', 'date -u +\"%Y-%m-%dT%H:%M:%SZ\"') }}"
      when:
        - disk_usage.rc | default(1) == 0
        - disks_over_threshold | length > 0

    - name: Send disk space notification
      uri:
        url: "{{ notification_webhook }}"
        method: POST
        body_format: json
        body: "{{ discord_message }}"
        status_code: [200, 204]
        timeout: 30
      delegate_to: localhost
      become: false
      when:
        - disk_usage.rc | default(1) == 0
        - disks_over_threshold | length > 0
        - notification_webhook | length > 0
